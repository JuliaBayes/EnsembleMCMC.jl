name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Julia ${{ matrix.julia }} / ${{ matrix.os }} / ${{ matrix.threads }} threads
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_failure || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {julia: '1.10', os: ubuntu-latest, threads: '1'}
          - {julia: '1.10', os: ubuntu-latest, threads: '4'}
          - {julia: '1', os: macos-latest, threads: '4'}
          - {julia: '1', os: windows-latest, threads: '4'}
          - {julia: 'pre', os: ubuntu-latest, threads: '4', allow_failure: true}
    env:
      JULIA_NUM_THREADS: ${{ matrix.threads }}
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3.3.0
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1

  # Only this job gets id-token: write, for the Codecov OIDC upload.
  # There is no GPU job because no GPU runners are available. See CONTRIBUTING.md for the CUDA tests.
  coverage:
    name: Coverage (Julia 1 / ubuntu-latest / 4 threads)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      JULIA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3.3.0
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          coverage: true
      - uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: lcov.info
          if-no-files-found: error
      - uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          files: lcov.info
          disable_search: true
          fail_ci_if_error: true

  docs:
    name: Documentation and doctests
    runs-on: ubuntu-latest
    env:
      JULIA_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3.3.0
      - name: Install documentation environment
        run: julia --project=docs -e 'using Pkg; Pkg.develop(PackageSpec(path=pwd())); Pkg.instantiate()'
      - name: Build documentation
        run: julia --project=docs docs/make.jl
      - uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/build
          if-no-files-found: error
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/build

  deploy-docs:
    name: Deploy documentation
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, coverage, docs]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
